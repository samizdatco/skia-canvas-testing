# which rust toolchains produce macOS dylibs that dyld on macOS 27 rejects ("mis-aligned LINKEDIT string pool")
# xcode-27 runs macOS 27 with the Xcode 27 SDK; macos-15 matches skia-canvas's release builds
name: strip-alignment

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        rust: [1.95.0, 1.96.1, 1.97.1, 1.98.0, 1.98.1, 1.99.0, 1.99.1]
        os: [macos-15, xcode-27]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Build & inspect probe variants
      shell: bash
      run: |
        mkdir -p out
        for dt in 10.14 12.0; do for feat in none data; do
          args=(); [[ $feat != none ]] && args=(--features $feat)
          tdir=$RUNNER_TEMP/probe-$dt-$feat
          (cd probe && CARGO_TARGET_DIR=$tdir MACOSX_DEPLOYMENT_TARGET=$dt cargo build -q --release "${args[@]}")
          cp $tdir/release/libprobe.dylib out/probe-dt$dt-$feat.dylib
        done; done
        echo "### probe built by rust ${{ matrix.rust }} on ${{ matrix.os }} ($(sw_vers -productVersion)), loaded here" >> $GITHUB_STEP_SUMMARY
        echo "| build | file | stroff%8 | nindirectsyms | minos/sdk | dlopen |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
        qa/inspect.sh "${{ matrix.os }} rust ${{ matrix.rust }}" out/*.dylib | tee -a $GITHUB_STEP_SUMMARY
    - uses: actions/upload-artifact@v4
      with:
        name: probe-${{ matrix.os }}-${{ matrix.rust }}
        path: out/

  probe-on-macos-27:
    needs: probe
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: probe-*
        path: artifacts
    - name: Load every probe build on macOS 27
      shell: bash
      run: |
        echo "### every probe build, loaded on $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY
        echo "| build | file | stroff%8 | nindirectsyms | minos/sdk | dlopen |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
        for dir in artifacts/probe-*; do
          qa/inspect.sh "$(basename $dir)" $dir/*.dylib | tee -a $GITHUB_STEP_SUMMARY
        done

  skia:
    strategy:
      fail-fast: false
      matrix:
        rust: [1.97.1, 1.99.1]
        os: [macos-15, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
    - name: Build skia.node the way the release workflow does
      env:
        MACOSX_DEPLOYMENT_TARGET: 10.14
      run: |
        npm ci --ignore-scripts
        npm run build
    - uses: actions/upload-artifact@v4
      with:
        name: skia-${{ matrix.os }}-${{ matrix.rust }}
        path: lib/skia.node

  skia-on-macos-27:
    needs: skia
    if: ${{ !cancelled() }}
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/download-artifact@v4
      with:
        pattern: skia-*
        path: artifacts
    - name: Load every skia.node build on macOS 27
      shell: bash
      run: |
        npm ci --ignore-scripts
        echo "### skia.node builds, loaded with node on $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY
        echo "| build | file | stroff%8 | nindirectsyms | minos/sdk | dlopen | node render |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
        for dir in artifacts/skia-*; do
          row=$(qa/inspect.sh "$(basename $dir)" $dir/skia.node)
          cp $dir/skia.node lib/skia.node
          render=$(node -e "const {Canvas}=require('./lib'); const c=new Canvas(64,64); c.getContext('2d').fillRect(0,0,8,8); console.log('ok, ' + c.toBufferSync('png').length + ' byte png')" 2>&1 | tail -1 | cut -c1-90)
          echo "$row $render |" | tee -a $GITHUB_STEP_SUMMARY
        done

  published-on-macos-27:
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Install skia-canvas@4.0.0 from npm and render
      shell: bash
      run: |
        mkdir -p $RUNNER_TEMP/published && cd $RUNNER_TEMP/published
        npm init -y > /dev/null
        npm install skia-canvas@4.0.0
        bin=$(ls node_modules/@skia-canvas/darwin-arm64/*.node)
        echo "### published skia-canvas@4.0.0 on $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY
        echo "| build | file | stroff%8 | nindirectsyms | minos/sdk | dlopen | node render |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
        row=$($GITHUB_WORKSPACE/qa/inspect.sh "npm 4.0.0" $bin)
        render=$(node -e "const {Canvas}=require('skia-canvas'); const c=new Canvas(64,64); c.getContext('2d').fillRect(0,0,8,8); console.log('ok, ' + c.toBufferSync('png').length + ' byte png')" 2>&1 | tail -1 | cut -c1-90)
        echo "$row $render |" | tee -a $GITHUB_STEP_SUMMARY
