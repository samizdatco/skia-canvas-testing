# loads the skia.node builds saved by an earlier strip-alignment run on macOS 27, without rebuilding them
name: load-artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: strip-alignment run whose skia-* artifacts to load
        required: true

permissions:
  actions: read
  contents: read

jobs:
  skia-on-macos-27:
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: actions/download-artifact@v4
      with:
        pattern: skia-*
        path: artifacts
        run-id: ${{ inputs.run_id }}
        github-token: ${{ github.token }}
    - name: Load every skia.node build on macOS 27
      shell: bash
      run: |
        npm ci --ignore-scripts
        echo "### skia.node builds from run ${{ inputs.run_id }}, loaded with node on $(sw_vers -productVersion)" >> $GITHUB_STEP_SUMMARY
        echo "| build | file | stroff%8 | nindirectsyms | minos/sdk | dlopen | node render |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
        for dir in artifacts/skia-*; do
          row=$(qa/inspect.sh "$(basename $dir)" $dir/skia.node)
          cp $dir/skia.node lib/skia.node
          render=$(node -e "const {Canvas}=require('./lib'); const c=new Canvas(64,64); c.getContext('2d').fillRect(0,0,8,8); console.log('ok, ' + c.toBufferSync('png').length + ' byte png')" 2>&1 | tail -1 | cut -c1-90 || true)
          echo "$row $render |" | tee -a $GITHUB_STEP_SUMMARY
        done
